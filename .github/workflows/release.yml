name: Release APK

# Push a tag like `v1.0.0` to build a release APK and attach it to a GitHub
# Release. Can also be run manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      # Signed with the debug key (see android/app/build.gradle.kts). Fine for
      # sideloading; swap in a real keystore before any Play Store upload.
      - run: flutter build apk --release

      - name: Stage the APK (constant + versioned names)
        run: |
          mkdir -p dist
          # Constant name -> stable "download latest" permalink:
          #   .../releases/latest/download/gps-utc-clock.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist/gps-utc-clock.apk
          # Versioned copy so a downloaded file says which version it is.
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/gps-utc-clock-${GITHUB_REF_NAME:-manual}.apk"
          ls -lh dist/

      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ### Download

            **[⬇️ gps-utc-clock.apk](https://github.com/${{ github.repository }}/releases/latest/download/gps-utc-clock.apk)** — always points at the newest release.

            Sideload it on Android (enable "install unknown apps" for your browser/file manager). Debug-key signed; Android will warn about the source — that's expected.

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gps-utc-clock-apk
          path: dist/*.apk
